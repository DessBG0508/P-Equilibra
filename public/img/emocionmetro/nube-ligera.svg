<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="cloudLightGrad" x1="30" y1="20" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#E0F2FE" />
      <stop offset="100%" stopColor="#BAE6FD" />
    </linearGradient>
    <filter id="cloudGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Nube suave y esponjosa -->
  <path d="M38 88
    C25 88 16 78 16 66
    C16 55 24 46 34 44
    C37 30 49 20 64 20
    C79 20 91 30 95 44
    C105 45 113 54 113 65
    C113 77 104 88 91 88
    Z"
    fill="url(#cloudLightGrad)"
    filter="url(#cloudGlow)"
  />
  <!-- Ojos alegres serenos -->
  <path d="M46 56 C48 51 54 51 56 56" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M72 56 C74 51 80 51 82 56" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Sonrisa dulce -->
  <path d="M58 64 C61 69 67 69 70 64" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <!-- Mejillas rosadas suaves -->
  <ellipse cx="40" cy="63" rx="4.5" ry="3" fill="#FDA4AF" fill-opacity="0.65" />
  <ellipse cx="88" cy="63" rx="4.5" ry="3" fill="#FDA4AF" fill-opacity="0.65" />
  <!-- Toques de luz -->
  <path d="M54 28 C60 26 68 26 73 29" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" fill="none" />
</svg>
