<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="stormGrad" x1="30" y1="15" x2="100" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#64748B" />
      <stop offset="70%" stopColor="#475569" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="15" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#EAB308" />
    </linearGradient>
    <filter id="stormGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.3" />
