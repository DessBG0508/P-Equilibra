<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="dropGrad" x1="40" y1="20" x2="90" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#93C5FD" />
      <stop offset="60%" stopColor="#60A5FA" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>
    <filter id="dropGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1D4ED8" flood-opacity="0.22" />
    </filter>
  </defs>
  <!-- Gota de agua estilizada -->
  <path d="M64 16
    C58 28 32 64 32 86
    C32 104 46 118 64 118
    C82 118 96 104 96 86
    C96 64 70 28 64 16 Z"
    fill="url(#dropGrad)"
    filter="url(#dropGlow)"
  />
  <!-- Reflejo curvo superior -->
  <path d="M48 48 C42 60 40 72 40 84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.65" fill="none" />
  <!-- Ojos caídos / tiernos -->
  <path d="M49 76 C51 72 56 72 57 76" stroke="#1E3A8A" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M71 76 C72 72 77 72 79 76" stroke="#1E3A8A" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <!-- Boca melancólica -->
  <path d="M59 90 C62 86 66 86 69 90" stroke="#1E3A8A" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <!-- Lagrimita pequeña -->
  <circle cx="50" cy="83" r="2" fill="#E0F2FE" />
</svg>
