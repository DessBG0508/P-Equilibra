<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="cloudNormGrad" x1="30" y1="20" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#F1F5F9" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>
    <filter id="cloudNormGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#475569" flood-opacity="0.14" />
    </filter>
  </defs>
  <!-- Nube neutral y tranquila -->
  <path d="M38 88
