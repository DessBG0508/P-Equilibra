    filter="url(#cloudNormGlow)"
  />
  <!-- Ojos serenos y curiosos -->
  <circle cx="51" cy="54" r="3" fill="#334155" />
  <circle cx="77" cy="54" r="3" fill="#334155" />
  <!-- Boca neutra relajada -->
  <line x1="59" y1="65" x2="69" y2="65" stroke="#334155" stroke-width="2.6" stroke-linecap="round" />
  <!-- Mejillas neutras muy tenues -->
  <ellipse cx="41" cy="62" rx="3.5" ry="2.5" fill="#CBD5E1" fill-opacity="0.8" />
  <ellipse cx="87" cy="62" rx="3.5" ry="2.5" fill="#CBD5E1" fill-opacity="0.8" />
</svg>
